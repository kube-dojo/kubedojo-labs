misconfigurations:
  - id: AVD-DS-0002
    paths:
      - scripts/ci/Dockerfile.kind-harness
    statement: The kind node image runs kubelet and system services as root on an ephemeral runner.
  - id: AVD-DS-0002
    paths:
      - scripts/ci/Dockerfile.ubuntu-harness
    statement: The disposable Ubuntu lab boots systemd as root and supports privileged scenario setup.
# Report-only disposition for the kind harness (designated approvals on
# kube-dojo/kubedojo-labs#106), enforced by the kind-harness-image job in
# .github/workflows/security.yml. Every HIGH/CRITICAL row is still reported.
# A row is report-only only when it is:
# - inherited: same package, version and advisory reported for this exact
#   digest, in the digest's layers, whether or not a fix exists upstream;
# - inherited-upgrade: a Debian package of the digest upgraded by the harness,
#   with the same advisory reported for the same name, architecture and
#   distribution in the digest and no fixed version for the upgrade;
# - approved-unfixed: a Debian package the digest does not ship, named exactly
#   in unfixed-project-packages, while Trivy reports no fixed version.
# Every other row blocks, including downgrades, same-version rewrites and a
# fixed version on an upgraded or approved package. Unknown attribution,
# missing or malformed scan data (including a built image that lacks the
# distribution or any package the digest ships), a changed digest, a review-by
# date in the past or a window over 30 days fail closed. The Dockerfile must
# have exactly one literal FROM equal to the recorded base, and the built
# image's layers must start with that digest's layers.
# Review again at the next kind release and at least every 30 days; only the
# 30-day bound is enforced here. .github/dependabot.yml proposes newer
# kindest/node images as a prompt for the release review.
inherited-base-images:
  - dockerfile: scripts/ci/Dockerfile.kind-harness
    base: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    owner: claude-cto
    reviewed: "2026-11-21"
    review-by: "2026-12-21"
    # python3 (with libexpat1) serves the lab scripts and the step driver in
    # the node; these Debian builds have HIGH advisories without fixes.
    unfixed-project-packages:
      - python3.13
      - python3.13-minimal
      - libpython3.13-minimal
      - libpython3.13-stdlib
      - libexpat1
    statement: >-
      The kind v0.33.0 default node image for Kubernetes 1.37.0, the latest
      stable kind release. Its distribution packages and compiled runtime
      binaries carry upstream HIGH/CRITICAL findings, many without fixes, that
      the lab harness cannot change. It runs only as a disposable cluster node
      on an ephemeral GitHub-hosted runner with a read-only token and no secrets.
