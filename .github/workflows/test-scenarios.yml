name: Test Lab Scenarios

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

# Lab code can compromise its entire ephemeral VM. No private network, secrets,
# writable token, caches or persistent runner may be attached to these jobs.
# Fork execution remains disabled by an explicit same-repository guard. The live
# approval policy was all_external_contributors; the brief's stricter literal
# all_outside_collaborators condition has not been observed, so no fork runs.
jobs:
  inventory:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
    cache-mode: none
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_work: ${{ steps.select.outputs.has_work }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Structural inventory and execution selection
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args+=(--base "$BASE_SHA"); fi
          python3 scripts/ci/scenarios.py "${args[@]}" --github-output "$GITHUB_OUTPUT"
      - name: Prove false-green paths fail
        run: python3 scripts/ci/self-test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: structural-inventory
          path: reports/inventory.json
          if-no-files-found: error
          retention-days: 7

  execute:
    needs: inventory
    if: >-
      needs.inventory.outputs.has_work == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    cache-mode: none
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install checksum-pinned kind
        if: matrix.backend == 'kubernetes-kubeadm-1node'
        run: |
          curl --fail --location --retry 2 --max-time 60 -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind' | sha256sum --check --strict
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
      - name: Execute independent learner, solution and negative lanes
        env:
          SCENARIO: ${{ matrix.scenario }}
          TOUCHED: ${{ matrix.touched }}
        run: python3 scripts/ci/run-scenarios.py "$SCENARIO" --event "$GITHUB_EVENT_NAME" --touched "$TOUCHED"
      - name: Prove fresh-cluster isolation with a cluster-scoped object
        if: matrix.scenario == 'prereq-k8s-1.1-first-cluster'
        run: timeout --signal=TERM 180s python3 scripts/ci/self-test.py --live-kind
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenario-${{ matrix.scenario }}
          path: reports/${{ matrix.scenario }}.json
          if-no-files-found: error
          retention-days: 7

  gate:
    name: CI Gate
    needs: [inventory, execute]
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
    cache-mode: none
    steps:
      - name: Require successful structural, self-test and execution jobs
        env:
          INVENTORY: ${{ needs.inventory.result }}
          EXECUTION: ${{ needs.execute.result }}
          HAS_WORK: ${{ needs.inventory.outputs.has_work }}
        run: |
          test "$INVENTORY" = success
          if [ "$HAS_WORK" = true ]; then test "$EXECUTION" = success; else test "$EXECUTION" = skipped; fi

# Published JSON is untrusted. No downstream job reads it as code or approval.
# The lane files issues outside execution jobs from residual failure reports.
